schema_version: 1
description: >
  Governance metadata for LLM-derived dp_ids — drives codex_prompt_gen
  filtering, verify_overlay_closed_loop evidence-kind enforcement, and
  merge_preserve refresh rules.

  Z3 version: covers the full 111 LLM-candidate dp_ids in the overlay
  schema (X5: 58; Z3 added 53). A/B/E bucket fields outside the schema
  are intentionally absent — verifier defaults them to closed-loop, and
  codex_prompt_gen will allowlist only fields present here with
  route ∈ {llm_close, llm_web}.

  Eight bucket-D fields are now declared with model_tier=web_analysis
  (L2.newbiz.tam, L3.product.lifecycle, L3.delivery.csat,
  L3.delivery.lead_time, L4.eff.conversion_retention,
  L4.share.customer_channel, L4.volume.foot_traffic, L4.volume.frequency)
  and carry an ``allowed_evidence_kinds`` whitelist so the verifier knows
  to accept annual_report / research_report / investor_relations /
  external_url / industry_panel.

  source_dependencies are filled in where a reasonable upstream
  SQLite/overlay dp_id exists. Empty deps are explicitly marked so the
  prompt fingerprint column shows "-" instead of breaking the refresh
  trigger.

