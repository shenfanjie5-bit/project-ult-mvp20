schema_version: 1
industry_set_id: mvp20-industries-v1
description: >-
  13 industry universe for the Project ULT MVP. Each entry is the canonical
  English slug (used in code and contracts) plus the human-readable Chinese
  display name. Constituents are listed in mvp20.universe.yaml and reference
  these slugs via industry_ids.

  graph_status indicates whether the corresponding causal-graph YAML at
  config/industry_graphs/<id>.yaml is present (default) or pending (a
  reserved slot whose content is still being authored). Pending industries
  are excluded from validate-graphs structural checks until the file is
  added.
