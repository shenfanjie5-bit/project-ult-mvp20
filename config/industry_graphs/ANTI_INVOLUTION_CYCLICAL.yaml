edges:
  - id: EDGE.CYC.001
    source: EVENT.anti_involution_policy
    target: SIGNAL.effective_supply_contraction
    relation: drives_supply_cut
    polarity: positive
    beta_positive: 0.75
    beta_negative: 0.70
    threshold: 价格和库存数据变化
    lag: 1-4 quarters
    dedup_group: 供给组
    views: [causal_propagation, core_factor]
  - id: EDGE.CYC.002
    source: SIGNAL.effective_supply_contraction
    target: SIGNAL.product_price
    relation: drives_price
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.65
    threshold: 价差扩大
    lag: 即时-2 quarters
