schema_version: 1
template_version: v3.1.1
industry_id: ANTI_INVOLUTION_CYCLICAL
industry_name_cn: 反内卷周期化工建材钢铁
graph_status: present

priors:
  boundary:
    scope_segments:
      - 化工
      - 钢铁
      - 水泥
      - 玻璃
      - 建材
      - 煤化工
      - 制造周期品
      - 反内卷受益行业
    core_judgment: >-
      该板块不是单纯看需求复苏，而是看供给约束 + 库存去化 + 价格/价差修复。
      反内卷逻辑只有传导到价格和利润，才会变成股价超额收益。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注供给约束、需求修复、库存周期、成本价差、并购集中、价值陷阱等。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.25}
    - {name: 等待验证, probability: 0.30}
    - {name: 结构分化, probability: 0.20}
    - {name: 杀估值, probability: 0.15}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、价格}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 政策、新闻}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 价格 / 库存 / 开工}
      - {name: tail_risk_prob, description: 尾部风险, source: 弱需求 + 价格反弹}

  path_dedup_groups: [供给组, 需求组, 库存组, 价格组, 竞争组, 风险组]

  exposure:
    factors:
      - 行业龙头地位与定价权
      - 成本曲线位置
      - 低效产能比例
      - 产品价差敏感度
      - 库存与开工率
      - 政策约束传导
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 行业龙头 / 价差弹性强
      "4": 区域龙头 / 价格敏感
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 价格 × 销量
      GrossMargin: 价差与成本
      OpexRatio: 重资产稳态低
      EBIT_EPS: 周期弹性显著
      FCF: 价格上行期改善
      Leverage: 重资产 / 高杠杆

  valuation_mix:
    weights:
      PB: 0.30
      EV_EBITDA: 0.30
      PE: 0.20
      DCF: 0.10
      Dividend: 0.10
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 政策执行偏弱 / 产能复产
      - 需求疲弱 + 库存高企
      - 价格短暂反弹后回落
      - 海外贸易壁垒
      - 利率上行 + 债务压力
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 限产执行与产能退出
    - 地产 / 基建 / PMI
    - 库存与开工率
    - 价差与原料价格
    - 行业并购与 CR 提升
    - 现金流与债务

  falsification:
    bullish_triggers:
      - 反内卷政策落地 + 价格上行
      - 库存连续去化 + 补库启动
      - 价差扩大并稳定
      - 龙头并购 / 集中度提升
    bearish_triggers:
      - 政策执行弱 / 产能复产
      - 库存回升 + 需求转弱
      - 价格短暂反弹后回落
      - 利率上行 + 现金流恶化

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    反内卷周期的图谱重点是判断供给收缩 + 价差修复是否真实兑现到利润，并防止
    在弱需求 + 假反弹时被价值陷阱套牢。

