schema_version: 1
template_version: v3.1.1
industry_id: NONFERROUS_METALS
industry_name_cn: 有色资源黄金铜稀土小金属
graph_status: present

priors:
  boundary:
    scope_segments:
      - 黄金
      - 白银
      - 铜
      - 铝
      - 锂
      - 镍
      - 钴
      - 稀土
      - 钨
      - 锑
      - 锡
      - 钼
      - 矿山
      - 冶炼
      - 资源回收
      - 资源 ETF
    core_judgment: >-
      该板块的核心是商品价格、库存周期、供给扰动和资源安全溢价。股价弹性通常
      来自价格上涨 × 资源储量/产量 × 成本曲线位置 × 估值重估。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注实际利率、库存、供给扰动、资源安全溢价、成本曲线和反转风险。

  state_probabilities:
    - {name: 强多头, probability: 0.20}
    - {name: 温和多头, probability: 0.25}
    - {name: 结构分化, probability: 0.20}
    - {name: 杀估值, probability: 0.15}
    - {name: 等待验证, probability: 0.20}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、产业链}
      - {name: price_implied_expectation, description: 股价隐含预期, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 新闻、社媒}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 价格/库存数据}
      - {name: tail_risk_prob, description: 尾部风险, source: 商品反转}

  path_dedup_groups: [价格组, 需求组, 政策组, 供给组, 盈利组, 风险组]

  exposure:
    factors:
      - 资源储量与产量
      - 成本曲线位置（现金成本）
      - 资源安全 / 政策受益
      - 海外资源占比
      - 库存与套保比例
      - 资本开支与扩产能力
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 资源储量大 / 成本低 / 价格弹性强
      "4": 资源储量较大但价格弹性受套保影响
      "3": 部分资源敞口
      "2": 主要为冶炼或贸易
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 价格 × 产量
      GrossMargin: 价格与现金成本差
      OpexRatio: 矿山稳态运营低
      EBIT_EPS: 价格弹性带来利润放大
      FCF: 资本开支期承压
      Leverage: 重资产 / 矿山扩产融资

  valuation_mix:
    weights:
      PE: 0.25
      PB: 0.20
      EV_EBITDA: 0.25
      DCF_MineNPV: 0.20
      Dividend: 0.10
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 商品价格高位回落
      - 美元走强 / 实际利率上行
      - 库存堆积 / 需求逆转
      - 成本曲线右移
      - 政策回收资源安全溢价
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 实际利率与美元指数
    - LME / SHFE 库存与持仓
    - PMI 与电网 / 新能源投资
    - 矿山新闻与产量
    - 现金成本与品位数据
    - 期货曲线与央行购金

  falsification:
    bullish_triggers:
      - 实际利率回落带动黄金
      - 工业金属库存连续下降
      - 资源安全政策落地
      - 矿山供给扰动持续
    bearish_triggers:
      - 美元走强 + 实际利率上行
      - 工业金属库存回补 + 需求疲弱
      - 政策执行偏弱
      - 商品价格高位放量回落

  tradability_panel:
    - {name: mu, formula: 路径影响聚合 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 商品波动 + 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    有色资源的图谱重点是判断商品价格的剩余涨幅是否还能传导到企业利润和估值，
    并避免在反转风险已经积累时追入。

