    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.50
    threshold: 估值溢价兑现
    lag: 即时-2 quarters
    dedup_group: 政策组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.007
    source: EVENT.mine_supply_disruption
    target: SIGNAL.commodity_price_curve
    relation: drives_price
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.75
    threshold: 扰动影响全球供给
    lag: 即时-2 quarters
    dedup_group: 供给组
    views: [causal_propagation, supply_chain]
  - id: EDGE.NONFE.008
    source: EVENT.high_cost_capacity_exit
    target: FIN.miner_unit_margin
    relation: improves_margin
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.65
    threshold: 成本优势明确
    lag: 1-4 quarters
    dedup_group: 盈利组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.009
    source: FIN.miner_unit_margin
    target: VAL.commodity_multiple
    relation: supports_multiple
    polarity: positive
    beta_positive: 0.55
    beta_negative: 0.60
    threshold: 周期估值修复
    lag: 即时-2 quarters
    dedup_group: 盈利组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.010
