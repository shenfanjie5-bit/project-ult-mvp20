    target: COMPANY.NONFERROUS_SECTOR
    relation: drives_alpha
    polarity: positive
    beta_positive: 0.55
    beta_negative: 0.65
    threshold: 估值传导到 alpha
    lag: 即时-2 quarters
    dedup_group: 盈利组
    views: [causal_propagation, core_factor]

  - id: EDGE.NONFE.RISK.001
