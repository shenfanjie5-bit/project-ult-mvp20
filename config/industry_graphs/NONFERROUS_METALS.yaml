edges:
  - id: EDGE.NONFE.001
    source: EVENT.real_rate_decline
    target: SIGNAL.gold_silver_price
    relation: drives_price
    polarity: positive
    beta_positive: 0.80
    beta_negative: 0.85
    threshold: 价格突破并保持
    lag: 即时-2 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.002
    source: SIGNAL.gold_silver_price
    target: FIN.miner_unit_margin
    relation: improves_margin
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.65
    threshold: 现金成本不动则吨毛利扩大
    lag: 即时-2 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.003
    source: EVENT.industrial_demand_recovery
    target: SIGNAL.industrial_metal_inventory
    relation: dampens_inventory
    polarity: positive
    beta_positive: 0.75
    beta_negative: 0.70
    threshold: 库存与需求同步
    lag: 1-4 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.NONFE.004
    source: SIGNAL.industrial_metal_inventory
    target: SIGNAL.commodity_price_curve
    relation: drives_price
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.65
    threshold: 库存下降伴随升水
    lag: 即时-2 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.005
    source: EVENT.export_restriction_critical_metal
    target: SIGNAL.critical_metal_premium
    relation: drives_premium
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.60
    threshold: 政策实际影响供需
    lag: 即时-3 quarters
    dedup_group: 政策组
    views: [causal_propagation, core_factor]
  - id: EDGE.NONFE.006
