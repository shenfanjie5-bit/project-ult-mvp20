schema_version: 1
template_version: v3.1.1
industry_id: HK_CN_INTERNET
industry_name_cn: 港股互联网中概科技与平台经济
graph_status: present

priors:
  boundary:
    scope_segments:
      - 港股互联网
      - 中概科技
      - 平台电商
      - 本地生活
      - 游戏
      - 广告
      - 云计算
      - AI 应用
      - 在线娱乐
      - 恒生科技
    core_judgment: >-
      该板块的核心是平台经济政策稳定、消费和广告修复、AI 应用商业化、回购分
      红、南向/外资资金流和估值折价修复。需要同时看收入增长与资本开支压力。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注政策估值、消费电商、AI 应用、股东回报、成本控制、竞争风险。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.25}
    - {name: 结构分化, probability: 0.25}
    - {name: 等待验证, probability: 0.20}
    - {name: 杀估值, probability: 0.20}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、季报}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 政策 / 新闻}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 季报披露质量}
      - {name: tail_risk_prob, description: 尾部风险, source: 监管 / 补贴战}

  path_dedup_groups: [政策组, 需求组, 技术组, 资金组, 盈利组, 风险组]

  exposure:
    factors:
      - 平台政策受益度
      - 电商 / 广告 / 云收入占比
      - AI 应用变现能力
      - 回购 / 分红规模
      - 现金流安全
      - 海外业务占比
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 政策稳定 + AI 商业化领先 + 现金流强
      "4": 政策稳定但增长一般
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: GMV / 广告 / 订阅
      GrossMargin: 补贴 / 商品结构
      OpexRatio: 营销与 AI Capex
      EBIT_EPS: 利润弹性
      FCF: 自由现金流是核心
      Leverage: 大平台一般低

  valuation_mix:
    weights:
      PE: 0.30
      DCF_FCF: 0.25
      PS: 0.20
      SOTP: 0.20
      Dividend_Buyback: 0.05
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 平台监管突发
      - 补贴战 / 价格战
      - AI Capex 高但收入慢
      - 海外审查与制裁
      - 消费疲弱
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 政策表述与监管事件
    - GMV / take rate / 广告 / 云收入
    - AI 功能使用率 / ARPU
    - 回购规模 / 分红率 / FCF
    - 补贴率 / Capex / 毛利率
    - 南向 / 外资资金流

  falsification:
    bullish_triggers:
      - 政策稳定 + 风险溢价下降
      - GMV 与广告同向上修
      - AI 商业化数据兑现
      - 回购分红规模扩大
    bearish_triggers:
      - 监管趋严或突发事件
      - 补贴战延续 + 利润率下行
      - AI Capex 高 + 收入不可见
      - FCF 下行 + 回购不可持续

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    港股互联网中概的图谱重点是政策稳定 + 消费和 AI 商业化兑现 + 现金回报，避免
    被监管尾部和补贴战吞掉估值修复。

