schema_version: 1
template_version: v3.1.1
industry_id: EXPORT_MFG
industry_name_cn: 出海制造汽车零部件机械家电
graph_status: present

priors:
  boundary:
    scope_segments:
      - 汽车零部件
      - 工程机械
      - 通用机械
      - 工业设备
      - 家电
      - 工具
      - 轻工消费品
      - 海外收入占比高的中国制造企业
    core_judgment: >-
      该板块的核心是海外需求、渠道库存、本地化产能、汇率、关税和品牌/产品升级。
      出海不是简单出口增长，而是利润率、现金流和政策风险的组合。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注海外需求、本地化、汇率、产品升级、汽车定点、贸易风险等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.30}
    - {name: 结构分化, probability: 0.25}
    - {name: 等待验证, probability: 0.20}
    - {name: 杀估值, probability: 0.15}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、海外需求}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 新闻、订单}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 出口数据 / 订单}
      - {name: tail_risk_prob, description: 尾部风险, source: 关税 / 制裁}

  path_dedup_groups: [需求组, 价格组, 竞争组, 质量组, 风险组]

  exposure:
    factors:
      - 海外收入占比与区域分布
      - 海外产能 / 本地化能力
      - 客户绑定（车企 / 商超 / 平台）
      - 汇率敏感度与套保比例
      - 产品升级与品牌力
      - 贸易合规与库存控制
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 海外收入高且本地化完整、订单可见
      "4": 海外受益但本地化或汇率受限
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 出口订单与定点
      GrossMargin: 汇率 / 产品结构 / 关税
      OpexRatio: 海外渠道与认证
      EBIT_EPS: 经营杠杆显著
      FCF: 海外建厂期承压
      Leverage: 投资期较高

  valuation_mix:
    weights:
      PE: 0.40
      EV_EBITDA: 0.25
      DCF: 0.15
      PB: 0.10
      SOTP: 0.10
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 关税 / 制裁 / 贸易摩擦
      - 海外需求骤降或库存高企
      - 汇率反向 + 套保失败
      - 客户份额丢失
      - 海外产能利用率不足
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 出口数据 / 订单
    - 海外渠道库存
    - 海外产能利用率
    - 汇率与套保比例
    - 车企定点 / SOP
    - 关税 / 制裁政策

  falsification:
    bullish_triggers:
      - 海外需求修复
      - 本地化产能利用率提升
      - 高端产品与品牌价格上行
      - 大客户定点订单连续
    bearish_triggers:
      - 海外去库存延续
      - 关税 / 制裁升级
      - 汇率反向 + 套保损失
      - 价格战削弱毛利率

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    出海制造的图谱重点是判断海外需求与本地化是否真实兑现到收入和利润，并避免
    被关税、汇率、价格战吞噬。

