edges:
  - id: EDGE.EXP.001
    source: EVENT.overseas_demand_recovery
    target: SIGNAL.export_orders
    relation: drives_orders
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.70
    threshold: 订单持续性
    lag: 1-4 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.EXP.002
