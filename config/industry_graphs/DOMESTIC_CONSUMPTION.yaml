    source: EVENT.confidence_recovery
    target: SIGNAL.same_store_sales
    relation: drives_demand
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.75
    threshold: 高频数据连续改善
    lag: 1-4 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
