schema_version: 1
template_version: v3.1.1
industry_id: DOMESTIC_CONSUMPTION
industry_name_cn: 内需服务消费文旅酒店航空医美
graph_status: present

priors:
  boundary:
    scope_segments:
      - 文旅
      - 酒店
      - 航空
      - 机场
      - 餐饮
      - 大众消费品
      - 医美
      - 养老
      - 托育
      - 健康服务
      - 服务消费
    core_judgment: >-
      该板块的核心是居民收入和消费信心、客流/客单价、供给收缩后的价格弹性以及
      费用率控制。消费修复需要数据确认，不能只看政策口号。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注信心、出行、供给收缩、大众品、医美合规、低价竞争等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.05}
    - {name: 温和多头, probability: 0.20}
    - {name: 等待验证, probability: 0.30}
    - {name: 结构分化, probability: 0.20}
    - {name: 杀估值, probability: 0.25}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、社零}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 假期 / 新闻}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 高频客流 / 客单价}
      - {name: tail_risk_prob, description: 尾部风险, source: 消费降级 / 监管}

  path_dedup_groups: [需求组, 供给组, 质量组, 政策组, 风险组]

  exposure:
    factors:
      - 服务消费业务占比
      - 客流 / 客单价敏感度
      - 渠道与门店覆盖
      - 高端品牌力 / ASP
      - 监管合规与政策受益
      - 现金流与资产负债
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 直接受益于客流 / ASP 修复
      "4": 间接受益但受供给约束
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 客流 × 客单价
      GrossMargin: 价格 + 成本控制
      OpexRatio: 门店 / 人员费用
      EBIT_EPS: 经营杠杆显著
      FCF: 现金流稳定
      Leverage: 一般较低，部分酒店航空高

  valuation_mix:
    weights:
      PE: 0.40
      EV_EBITDA: 0.20
      DCF: 0.15
      PS: 0.15
      Dividend: 0.10
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 消费降级 / 价格战
      - 监管收紧（医美 / 教育）
      - 油价 + 汇率上行（航空）
      - 客流恢复慢于预期
      - 资本开支期 + 负债压力
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 居民信心与社零
    - 假期 / 商旅高频数据
    - 客流 / 客单价 / RevPAR
    - 门店与渠道库存
    - 医美合规政策
    - 现金流与资本开支

  falsification:
    bullish_triggers:
      - 居民收入与信心连续改善
      - 节假日 / 商旅出行恢复
      - 龙头供给收缩 + ASP 上升
      - 大众品渠道库存正常
    bearish_triggers:
      - 消费降级 / 价格战
      - 旺丁不旺财
      - 监管收紧 + 需求疲弱
      - 渠道压货 + 提价失败

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    内需消费的图谱重点是看真实客流和客单价数据是否兑现，避免被政策口号或叙事
    带跑。

