edges:
  - id: EDGE.GRID.001
    source: EVENT.ai_power_demand
    target: SIGNAL.power_equipment_demand
    relation: drives_demand
    polarity: positive
    beta_positive: 0.75
    beta_negative: 0.60
    threshold: 项目招标和交付
    lag: 2-6 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.GRID.002
    source: SIGNAL.power_equipment_demand
    target: FIN.storage_revenue
    relation: drives_revenue
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.55
    threshold: 订单转收入
    lag: 1-3 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.003
    source: EVENT.renewable_consumption_pressure
    target: SIGNAL.storage_tender_price
    relation: drives_price
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.65
    threshold: 量价同步改善
    lag: 1-4 quarters
    dedup_group: 政策组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.004
    source: EVENT.uhv_capex_upgrade
    target: SIGNAL.grid_orders
    relation: drives_orders
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.55
    threshold: 中标金额关键
    lag: 2-6 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.GRID.005
    source: SIGNAL.grid_orders
    target: FIN.storage_revenue
    relation: drives_revenue
    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.55
    threshold: 订单确认收入
    lag: 1-3 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.006
    source: EVENT.solid_state_battery_breakthrough
    target: SIGNAL.solid_state_supply_chain
    relation: rerates_chain
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.95
    threshold: 区分实验室和量产
    lag: 4-12 quarters
    dedup_group: 技术组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.007
    source: SIGNAL.solid_state_supply_chain
    target: VAL.solid_state_repricing
    relation: drives_multiple
    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.70
    threshold: 估值切换
    lag: 2-6 quarters
    dedup_group: 技术组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.008
    source: EVENT.capacity_clearance
    target: SIGNAL.industry_utilization
    relation: improves_utilization
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.80
    threshold: 价格和稼动率同步
    lag: 1-4 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.009
    source: SIGNAL.industry_utilization
    target: FIN.storage_gross_margin
    relation: improves_margin
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.55
    threshold: 毛利率修复
    lag: 1-3 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]
  - id: EDGE.GRID.010
    source: VAL.storage_growth_multiple
    target: COMPANY.STORAGE_GRID_SECTOR
    relation: drives_alpha
    polarity: positive
    beta_positive: 0.55
    beta_negative: 0.60
    threshold: 估值传导到 alpha
    lag: 即时-2 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]

  - id: EDGE.GRID.RISK.001
    source: RISK.overseas_trade_barrier
    target: FIN.storage_revenue
    relation: dampens_revenue
    polarity: negative
    beta_positive: 0.30
    beta_negative: 1.10
    threshold: 海外占比高时敏感
    lag: 即时-4 quarters
    dedup_group: 风险组
    views: [risk]
  - id: EDGE.GRID.RISK.002
    source: RISK.price_war_persistence
    target: FIN.storage_gross_margin
    relation: dampens_margin
    polarity: negative
    beta_positive: 0.30
    beta_negative: 1.05
    threshold: 价格战吞噬毛利
    lag: 1-3 quarters
    dedup_group: 风险组
    views: [risk]
  - id: EDGE.GRID.RISK.003
    source: RISK.price_war_persistence
    target: VAL.storage_growth_multiple
    relation: compresses_valuation
    polarity: negative
    beta_positive: 0.30
    beta_negative: 0.95
    threshold: 价格战延续 + 估值兑现
    lag: 即时-2 quarters
    dedup_group: 风险组
    views: [risk]


