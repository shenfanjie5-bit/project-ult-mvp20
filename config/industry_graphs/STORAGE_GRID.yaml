schema_version: 1
template_version: v3.1.1
industry_id: STORAGE_GRID
industry_name_cn: 储能电网AI电力与固态电池
graph_status: present

priors:
  boundary:
    scope_segments:
      - 储能电池
      - PCS
      - BMS
      - 温控
      - 逆变器
      - 变压器
      - 特高压
      - 配网
      - 电力自动化
      - 数据中心电力
      - 固态电池
      - 电池材料与设备
    core_judgment: >-
      该板块的关键是从新能源产能过剩中筛选真实受益于电网投资、储能招标、AI 电
      力瓶颈和技术升级的环节。价格战与产能出清是主要分水岭。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注 AI 电力、新能源消纳、电网投资、固态电池、产能出清、海外风险。

  state_probabilities:
    - {name: 强多头, probability: 0.15}
    - {name: 温和多头, probability: 0.25}
    - {name: 结构分化, probability: 0.30}
    - {name: 等待验证, probability: 0.20}
    - {name: 杀估值, probability: 0.10}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、产业链}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 新闻、社媒}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 招标 / 价格}
      - {name: tail_risk_prob, description: 尾部风险, source: 海外贸易 / 价格战}

  path_dedup_groups: [需求组, 价格组, 政策组, 技术组, 风险组]

  exposure:
    factors:
      - 数据中心电力相关收入占比
      - 储能招标份额与海外占比
      - 电网设备产品力与中标
      - 固态电池技术储备
      - 海外销售与本地化能力
      - 产能利用率与现金流
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 直接受益高电力订单 / 储能 / 固态电池
      "4": 间接受益但订单可见
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 招标 / 出货 / ASP
      GrossMargin: 价格战与原料成本
      OpexRatio: 研发 + 海外渠道
      EBIT_EPS: 经营杠杆显著
      FCF: 扩产与备货承压
      Leverage: 重资产环节高

  valuation_mix:
    weights:
      PE: 0.35
      EV_EBITDA: 0.20
      PS: 0.15
      DCF: 0.15
      SOTP: 0.15
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 海外贸易壁垒 / 关税
      - 价格战使盈利无法兑现
      - 新能源消纳不及预期
      - 固态电池技术不成熟
      - 数据中心建设延期
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 数据中心建设和电力接入
    - 储能招标价 / 中标量
    - 电网投资计划与中标
    - 固态电池样品 / 量产
    - 价格、开工率、库存
    - 海外贸易政策

  falsification:
    bullish_triggers:
      - AI 电力订单连续兑现
      - 储能招标价格止跌
      - 特高压 / 配网中标加速
      - 固态电池量产时间临近
    bearish_triggers:
      - 电力建设延期
      - 价格战延续 + 产能继续扩张
      - 利用小时与招标价低
      - 海外关税或本地化阻力上升

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    储能电网与固态电池的图谱重点是从产能过剩里筛选真实受益于电力 / 招标 / 技术
    切换的公司，避免在价格战阶段错追估值。

