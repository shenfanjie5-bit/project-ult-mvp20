edges:
  - id: EDGE.SEMI.001
    source: EVENT.export_control_escalation
    target: SIGNAL.domestic_equipment_share
    relation: drives_share
    polarity: positive
    beta_positive: 0.80
    beta_negative: 0.70
    threshold: 招标或产线导入可见
    lag: 2-8 quarters
    dedup_group: 政策组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.SEMI.002
    source: SIGNAL.domestic_equipment_share
    target: SIGNAL.fab_orders
    relation: drives_orders
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.60
    threshold: 中标金额可见
    lag: 1-3 quarters
    dedup_group: 政策组
    views: [causal_propagation, supply_chain]
