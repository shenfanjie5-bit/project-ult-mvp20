schema_version: 1
template_version: v3.1.1
industry_id: SEMI_EQUIPMENT
industry_name_cn: 半导体设备材料与先进封装
graph_status: present

priors:
  boundary:
    scope_segments:
      - 刻蚀
      - 薄膜沉积
      - 清洗
      - CMP
      - 检测量测
      - 离子注入
      - 零部件
      - 光刻胶
      - 靶材
      - 电子特气
      - 先进封装
      - Chiplet
      - HBM 配套
      - 存储
      - EDA
      - 国产 AI 芯片
    core_judgment: >-
      该板块的核心因果变量是国产替代订单、晶圆厂资本开支、存储周期、先进封装
      瓶颈和关键工艺良率。估值需要同时看政策安全溢价与真实订单兑现。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 公司特异超额收益来自国产替代、Capex、存储、先进封装、良率突破等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.30}
    - {name: 结构分化, probability: 0.30}
    - {name: 等待验证, probability: 0.20}
    - {name: 杀估值, probability: 0.10}

  shock_model:
    formula: |
      Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、业绩前瞻、产业调研}
      - {name: price_implied_expectation, description: 股价隐含预期, source: 事件前涨跌、ETF 资金}
      - {name: narrative_expectation, description: 叙事热度, source: 新闻、社媒、路演}
      - {name: pre_event_runup, description: 事件前涨幅, source: 事件前 5/20/60 日收益}
      - {name: post_event_reaction, description: 事件后反应, source: 公告后或消息后收益}
      - {name: remaining_impact, description: 剩余影响, source: 理论影响减去已反应}
      - {name: data_quality, description: 数据质量, source: 公告 > 财报 > 订单}
      - {name: tail_risk_prob, description: 尾部风险, source: 监管、技术、客户、财务}

  path_dedup_groups: [需求组, 价格组, 政策组, 技术组, 竞争组, 风险组]

  exposure:
    factors:
      - 国产化收入占比
      - 客户验证阶段（样品 / 导入 / 量产 / 复购）
      - 设备/材料所在工艺环节稀缺度
      - 先进封装或 AI 芯片相关收入占比
      - 研发强度与技术壁垒
      - 现金储备与扩产能力
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 直接收入占比高、订单可验证、利润可传导、龙头地位强
      "4": 直接受益，但收入占比或利润传导略弱
      "3": 有业务关联，但对当期财务贡献不确定
      "2": 更多是主题映射，商业化或订单弱
      "1": 关系间接

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 招标到收入存在滞后
      GrossMargin: 量产良率、产品结构、议价决定
      OpexRatio: 研发费用高
      EBIT_EPS: 收入规模过临界点后经营杠杆明显
      FCF: 扩产、备货、研发投入波动
      ROE: 成熟设备商规模化提升

  valuation_mix:
    weights:
      PE: 0.25
      PS: 0.25
      EV_EBITDA: 0.15
      DCF: 0.10
      SOTP_Pipeline: 0.25
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 关键设备或材料技术突破低于预期
      - 晶圆厂 Capex 下修
      - 存储周期反转
      - 海外限制升级导致供应链断点
      - 估值过高但订单兑现慢
    formula_note: mu_adjusted = mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR

  validation_signals:
    - 晶圆厂招标和国产设备中标
    - 客户验证与量产导入公告
    - 存储价格和库存周期
    - 先进封装产能扩张数据
    - 毛利率与研发费用率变化
    - 分析师订单和收入预测上修
    - 海外管制政策变化

  falsification:
    bullish_triggers:
      - 国产设备材料中标密度提升
      - 先进封装和 HBM 配套订单放量
      - 存储价格持续上行并带动 Capex
      - 量产客户数量增加
    bearish_triggers:
      - 招标延期或中标单价下降
      - 客户验证迟迟无法转量产
      - 存储价格回落
      - 研发投入上升但收入不放量

  tradability_panel:
    - {name: mu, formula: 路径影响聚合减去风险惩罚, interpretation: 预期超额收益}
    - {name: sigma, formula: 参数与路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma 减去成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre 与 D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险与拥挤
    - 输出 alpha、概率、置信区间和可交易性

  one_line_summary: >-
    半导体设备材料与先进封装的图谱重点不是判断这个行业好不好，而是判断：利好
    是否超预期、是否已经反映、能否传导到公司财务、估值是否还有空间、尾部风险
    是否足以吞掉收益。

