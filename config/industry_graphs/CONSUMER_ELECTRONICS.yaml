schema_version: 1
template_version: v3.1.1
industry_id: CONSUMER_ELECTRONICS
industry_name_cn: 消费电子AI终端PCB元件
graph_status: present

priors:
  boundary:
    scope_segments:
      - AI 手机
      - AI PC
      - AI 眼镜
      - 可穿戴
      - AR / VR
      - 声学
      - 光学
      - 连接器
      - 摄像头模组
      - 被动元件
      - PCB
      - 散热
      - 结构件
      - 终端供应链
    core_judgment: >-
      该板块的核心是终端换机周期、AI 功能带来的 BOM 价值量提升、客户新品节奏、
      库存周期和供应链份额变化。需要区分概念发布和真实拉货。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注换机、价值量、客户新品、库存、份额、砍单等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.20}
    - {name: 结构分化, probability: 0.25}
    - {name: 等待验证, probability: 0.25}
    - {name: 杀估值, probability: 0.20}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、产业链}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 新品、社媒}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 出货 / 拉货数据}
      - {name: tail_risk_prob, description: 尾部风险, source: 砍单 / 价格}

  path_dedup_groups: [需求组, 价格组, 库存组, 竞争组, 风险组]

  exposure:
    factors:
      - 终端品牌客户绑定
      - AI 功能 BOM 价值量
      - 新品周期与拉货节奏
      - 渠道库存与稼动率
      - 供应链份额
      - 现金流与扩产
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 进入大客户量产 BOM
      "4": 间接受益但拉货可见
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 出货 × ASP
      GrossMargin: 客户结构 / 价格战
      OpexRatio: 研发 / 客户服务
      EBIT_EPS: 经营杠杆
      FCF: 库存与备货影响
      Leverage: 重资产环节较高

  valuation_mix:
    weights:
      PE: 0.35
      EV_EBITDA: 0.20
      PS: 0.15
      DCF: 0.15
      SOTP: 0.15
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 终端需求弱 / 砍单
      - 客户降价或份额丢失
      - 库存高企 / 价格继续下跌
      - 技术替代
      - 海外贸易限制
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 终端出货 / 预售 / 拉货
    - BOM 变化与规格升级
    - 客户认证与新品发布
    - 渠道库存 / 稼动率
    - 元件价格 / 份额变化
    - 海外政策

  falsification:
    bullish_triggers:
      - AI 终端拉货持续
      - 新品 BOM 价值量提升
      - 渠道库存连续去化
      - 进入大客户量产 BOM
    bearish_triggers:
      - 砍单传闻 + 份额丢失
      - 渠道库存高企
      - 价格继续下跌
      - 技术替代或贸易限制

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    消费电子的图谱重点是看新品和 AI 功能是否真实拉货，避免在概念发布期与高价
    格期被砍单/降价吞掉收益。

