edges:
  - id: EDGE.CE.001
    source: EVENT.ai_terminal_launch
    target: SIGNAL.terminal_shipments
    relation: drives_demand
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.80
    threshold: 终端销量需验证
    lag: 1-4 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.CE.002
    source: SIGNAL.terminal_shipments
    target: FIN.electronics_revenue
    relation: drives_revenue
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.60
    threshold: 出货转收入
    lag: 1-2 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.CE.003
