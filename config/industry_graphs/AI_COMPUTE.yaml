edges:
  # ---- Demand path: Capex -> orders -> revenue -> EPS -> alpha ----
  - id: EDGE.AI.001
    source: EVENT.meta_ai_capex_upgrade
    target: SIGNAL.hyperscaler_ai_demand
    relation: drives_demand
    polarity: positive
    beta_positive: 0.85
    beta_negative: 0.70
    threshold: 云厂商年度/季度 Capex 上修达全年收入可见贡献
    lag: 1-4 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.AI.002
    source: SIGNAL.hyperscaler_ai_demand
    target: SIGNAL.blackwell_orders
    relation: drives_orders
    polarity: positive
    beta_positive: 0.80
    beta_negative: 0.65
    threshold: GPU / 整机柜采购可见
    lag: 1-2 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain]
  - id: EDGE.AI.003
    source: SIGNAL.blackwell_orders
    target: FIN.nvda_dc_revenue
    relation: drives_revenue
    polarity: positive
    beta_positive: 0.75
    beta_negative: 0.65
    threshold: 订单转收入确认
    lag: 1-3 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.AI.004
    source: FIN.nvda_dc_revenue
    target: FIN.nvda_eps
    relation: operates_leverage
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.60
    threshold: 经营杠杆放大
    lag: 1-2 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.AI.005
    source: FIN.nvda_eps
    target: COMPANY.NVDA
    relation: drives_alpha
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.55
    threshold: 分析师盈利预测上修
    lag: 即时-1 quarter
    dedup_group: 需求组
    views: [causal_propagation, core_factor]
  - id: EDGE.AI.006
    source: SIGNAL.hyperscaler_ai_demand
    target: SIGNAL.optical_module_orders
    relation: drives_orders
    polarity: positive
    beta_positive: 0.75
    beta_negative: 0.60
    threshold: 光模块订单可见
    lag: 1-3 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain]

  # ---- Price / value-uplift path: 800G upgrade -> ASP -> margin ----
  - id: EDGE.AI.007
    source: EVENT.speed_tier_upgrade
    target: SIGNAL.asp_uplift_800g
    relation: drives_price_uplift
    polarity: positive
    beta_positive: 0.75
    beta_negative: 0.65
    threshold: 新速率产品占比超过拐点
    lag: 1-3 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]
  - id: EDGE.AI.008
    source: SIGNAL.asp_uplift_800g
    target: FIN.industry_gross_margin
    relation: improves_margin
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.55
    threshold: 毛利率改善
    lag: 1-2 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]
  - id: EDGE.AI.009
    source: FIN.industry_gross_margin
    target: VAL.growth_multiple
    relation: supports_multiple
    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.55
    threshold: 估值倍数扩张
    lag: 即时-2 quarters
    dedup_group: 价格组
    views: [causal_propagation, core_factor]

  # ---- Tech-route path: CPO/硅光 reshuffle -> share -> alpha ----
  - id: EDGE.AI.010
    source: EVENT.tech_route_shift_cpo
    target: SIGNAL.supplychain_share_reshuffle
    relation: reshuffles_share
    polarity: mixed
    beta_positive: 0.80
    beta_negative: 0.95
    threshold: 进入头部客户认证清单
    lag: 2-6 quarters
    dedup_group: 技术组
    views: [causal_propagation, supply_chain, core_factor]
  - id: EDGE.AI.011
    source: SIGNAL.supplychain_share_reshuffle
    target: COMPANY.AI_COMPUTE_SECTOR
    relation: drives_alpha
    polarity: mixed
    beta_positive: 0.70
    beta_negative: 0.85
    threshold: 龙头重估或淘汰
    lag: 2-4 quarters
    dedup_group: 竞争组
    views: [causal_propagation, core_factor]

  # ---- Power / cooling path: DC buildout -> liquid cooling -> revenue ----
  - id: EDGE.AI.012
    source: EVENT.dc_buildout
    target: SIGNAL.liquid_cooling_penetration
    relation: drives_demand
    polarity: positive
    beta_positive: 0.65
    beta_negative: 0.55
    threshold: 实际项目和客户绑定
    lag: 2-5 quarters
    dedup_group: 需求组
    views: [causal_propagation, supply_chain]
  - id: EDGE.AI.013
    source: SIGNAL.liquid_cooling_penetration
    target: FIN.industry_revenue_uplift
    relation: drives_revenue
    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.50
    threshold: 配套设备收入增长
    lag: 1-3 quarters
    dedup_group: 需求组
    views: [causal_propagation, core_factor]

  # ---- Domestic substitution path ----
  - id: EDGE.AI.014
    source: EVENT.china_ai_compute_policy
    target: SIGNAL.domestic_compute_share
    relation: drives_share
    polarity: positive
    beta_positive: 0.70
    beta_negative: 0.60
