schema_version: 1
template_version: v3.1.1
industry_id: AI_COMPUTE
industry_name_cn: AI算力硬件与通信设备
graph_status: present

priors:
  boundary:
    scope_segments:
      - 光模块
      - CPO
      - 硅光
      - 光芯片
      - 高速铜缆
      - AI 服务器
      - 交换机
      - 液冷
      - 数据中心电源
      - AI PCB
      - 数据中心基础设施
    core_judgment: >-
      该板块的股价核心不是 AI 叙事本身，而是云厂商与大模型公司的资本开支是否
      持续上修，并最终转化为订单、收入、毛利率和分析师盈利上修。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 预测剥离大盘与行业贝塔后的公司特异超额收益 alpha_i_h。

  state_probabilities:
    - {name: 强多头, probability: 0.25}
    - {name: 温和多头, probability: 0.30}
    - {name: 结构分化, probability: 0.25}
    - {name: 杀估值, probability: 0.10}
    - {name: 等待验证, probability: 0.10}

  shock_model:
    formula: |
      Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
      D_pre  = (1 - PricedIn_pre / 5) ^ gamma
      D_post = exp(-kappa × max(0, sign(Shock) × realized_return / (abs(model_return) + epsilon)))
    fields:
      - {name: consensus_expectation, description: 分析师或市场的一致预期, source: 研报、业绩前瞻、产业调研}
      - {name: price_implied_expectation, description: 股价和估值中隐含的预期, source: 事件前 5/20/60 日涨跌、成交额、ETF 资金}
      - {name: narrative_expectation, description: 市场叙事热度, source: 新闻热度、社媒热度、路演反馈}
      - {name: pre_event_runup, description: 事件前已上涨幅度, source: 事件前 5/20/60 日收益}
      - {name: post_event_reaction, description: 事件后已反应幅度, source: 公告后或消息后收益}
      - {name: remaining_impact, description: 剩余未定价影响, source: 理论影响减去已反应影响}
      - {name: data_quality, description: 数据质量, source: 公告 > 财报 > 订单 > 传闻}
      - {name: tail_risk_prob, description: 尾部风险概率, source: 监管、技术、客户、财务等风险}

  path_dedup_groups: [需求组, 价格组, 政策组, 技术组, 竞争组, 风险组]

  exposure:
    factors:
      - AI 相关收入占比
      - 头部云厂商 / AI 客户绑定深度
      - 新速率产品量产能力
      - 供应链位置（核心器件 > 模块 > 配套）
      - 毛利率稳定性与议价能力
      - 客户集中度与库存周转
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 直接收入占比高、订单可验证、利润可传导、龙头地位强
      "4": 直接受益，但收入占比或利润传导略弱
      "3": 有业务关联，但对当期财务贡献不确定
      "2": 更多是主题映射，商业化或订单弱
      "1": 关系间接，难以形成财务贡献

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 订单、出货量、ASP 共同驱动
      GrossMargin: 新产品占比、良率、价格战影响
      OpexRatio: 研发与认证费用前置
      EBIT_EPS: 经营杠杆显著，收入上修可能放大利润弹性
      FCF: 扩产与备货可能压低短期现金流
      Leverage: 轻资产环节较低，设备/制造环节需看扩产压力

  valuation_mix:
    weights:
      PE: 0.35
      PS: 0.20
      EV_EBITDA: 0.20
      DCF: 0.10
      SOTP: 0.15
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 海外客户集中导致砍单冲击
      - 技术路线变化导致原有产品被替代
      - 价格战使收入增长无法传导到利润
      - 高估值下利好兑现变成卖点
      - 贸易与出口限制影响供应链
    formula_note: |
      mu_adjusted = mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR
      alpha_i_h = R_max_i_h × tanh(mu_adjusted_i_h / tau_h)

  validation_signals:
    - 云厂商和大模型公司 Capex 指引
    - 光模块 / 交换机 / 服务器订单与交付节奏
    - 800G / 1.6T 产品占比和毛利率
    - 液冷渗透率与数据中心开工
    - 库存周转天数和应收账款
    - 分析师盈利预测是否持续上修
    - 板块成交占比和 ETF 资金流入

  falsification:
    bullish_triggers:
      - AI Capex 连续两个季度上修
      - 核心公司订单与毛利率同步改善
      - 速率升级产品进入规模出货
      - 国产算力招标规模明显扩大
    bearish_triggers:
      - 板块高位放量但盈利预测不再上修
      - 毛利率环比下滑且库存上升
      - 大客户 Capex 或订单指引下修
      - 技术路线导致原供应链份额下降

  tradability_panel:
    - {name: mu, formula: 路径影响聚合减去风险惩罚, interpretation: 剥离大盘和行业后的预期收益}
    - {name: sigma, formula: 参数方差、路径方差、市场波动, interpretation: 越高表示判断越不稳定}
    - {name: prob_up, formula: Phi(mu / sigma), interpretation: 不是确定涨跌，只是概率}
    - {name: tradability, formula: mu / sigma 减去成本、流动性惩罚、拥挤惩罚, interpretation: 判断预期收益是否覆盖风险}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 防止追高已经兑现的利好}

  workflow_steps:
    - 识别事件：政策、订单、价格、技术、财报、资金
    - 计算 Surprise：实际变化减去多来源预期
    - 扣除 D_pre 和 D_post：判断是否已经定价
    - 通过主路径传导：需求、价格、成本、竞争、估值、风险
    - 按相关性分组去重
    - 映射到公司财务向量和混合估值模型
    - 扣除尾部风险、流动性、交易成本和拥挤度
    - 输出超额收益、上涨概率、置信区间和可交易性

  one_line_summary: >-
    AI 算力硬件与通信设备的图谱重点不是判断这个行业好不好，而是判断：利好是否超
    预期、是否已经反映、能否传导到公司财务、估值是否还有空间、尾部风险是否足以
    吞掉收益。

