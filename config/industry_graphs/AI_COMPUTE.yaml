  - id: EDGE.AI.015
    source: SIGNAL.domestic_compute_share
    target: FIN.industry_revenue_uplift
    relation: drives_revenue
    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.50
    threshold: 招标转收入确认
    lag: 2-4 quarters
    dedup_group: 政策组
    views: [causal_propagation, core_factor]

  # ---- Risk path: Capex over -> FCF -> ROI debate -> crowding -> alpha down ----
  - id: EDGE.AI.RISK.001
    source: EVENT.meta_ai_capex_upgrade
    target: RISK.ai_capex_excess_concern
    relation: triggers_tail_risk
    polarity: positive
    beta_positive: 0.40
    beta_negative: 0.30
    threshold: 高位放量但盈利预测未上修
    lag: 即时-2 quarters
    dedup_group: 风险组
    views: [risk]
  - id: EDGE.AI.RISK.002
    source: RISK.ai_capex_excess_concern
    target: RISK.fcf_pressure
    relation: amplifies
    polarity: positive
    beta_positive: 0.55
    beta_negative: 0.45
    threshold: 自由现金流压力上升
    lag: 即时-1 quarter
    dedup_group: 风险组
    views: [risk]
  - id: EDGE.AI.RISK.003
    source: RISK.fcf_pressure
    target: RISK.ai_roi_debate
    relation: escalates
    polarity: positive
    beta_positive: 0.50
    beta_negative: 0.40
    threshold: ROI 争议升温
    lag: 即时-2 quarters
    dedup_group: 风险组
    views: [risk]
  - id: EDGE.AI.RISK.004
    source: RISK.ai_roi_debate
    target: VAL.ai_compute_crowding
    relation: compresses_valuation
    polarity: positive
    beta_positive: 0.60
    beta_negative: 0.55
    threshold: 板块拥挤度上升
    lag: 即时-2 quarters
    dedup_group: 风险组
    views: [risk]
  - id: EDGE.AI.RISK.005
    source: VAL.ai_compute_crowding
    target: COMPANY.NVDA
    relation: drags_alpha
    polarity: negative
    beta_positive: 0.50
    beta_negative: 1.10
    threshold: 高估值时更易触发
    lag: 即时-2 quarters
    dedup_group: 风险组
    views: [risk]

  # ---- Customer concentration risk into target ----
  - id: EDGE.AI.RISK.006
    source: RISK.customer_concentration
