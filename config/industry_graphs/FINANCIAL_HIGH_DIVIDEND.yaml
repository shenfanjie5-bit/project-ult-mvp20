schema_version: 1
template_version: v3.1.1
industry_id: FINANCIAL_HIGH_DIVIDEND
industry_name_cn: 金融券商保险银行高股息
graph_status: present

priors:
  boundary:
    scope_segments:
      - 券商
      - 保险
      - 银行
      - 多元金融
      - 交易所产业链
      - 金融科技
      - 高股息央国企
      - 红利资产
    core_judgment: >-
      该板块的核心变量是资本市场成交和风险偏好、利率曲线、资产质量、权益市场
      表现、分红回购和政策呵护。金融股对大盘和行业贝塔尤其敏感，必须先剥离市
      场影响。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注券商弹性、保险投资、银行资产质量、红利、政策、信用尾部等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.30}
    - {name: 结构分化, probability: 0.20}
    - {name: 等待验证, probability: 0.20}
    - {name: 杀估值, probability: 0.20}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、宏观}
      - {name: price_implied_expectation, description: 股价隐含, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 新闻、资金面}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 财务披露}
      - {name: tail_risk_prob, description: 尾部风险, source: 信用风险}

  path_dedup_groups: [资金组, 估值组, 信用组, 政策组, 风险组]

  exposure:
    factors:
      - 经纪 / 自营 / 投行收入弹性
      - 投资资产配置（权益与债券）
      - 资产质量（不良 / 拨备）
      - 分红率与现金流可持续性
      - 政策受益与资本市场风险偏好
      - 区域 / 客户结构
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 直接受益于成交 / 利率 / 红利
      "4": 间接受益但弹性小
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 成交 + 利率 + 投资收益
      GrossMargin: 不适用，看费用 / ROE
      OpexRatio: 人力与科技投入
      EBIT_EPS: 经营杠杆敏感
      FCF: 银行 / 保险特殊
      Leverage: 高杠杆行业，注意监管资本

  valuation_mix:
    weights:
      PB: 0.40
      PE: 0.25
      Dividend: 0.20
      ROE_PB: 0.10
      SOTP: 0.05
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 地产 / 地方债 / 企业信用风险
      - 资本市场大幅回落
      - 长端利率持续下行
      - 资本监管收紧
      - 黑天鹅信用违约
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 日均成交额 / 两融余额
    - 长端利率 / 10Y 国债
    - 不良率 / 拨备覆盖率
    - 分红与回购公告
    - IPO / 再融资节奏
    - 政策信号

  falsification:
    bullish_triggers:
      - 成交持续放大 + 风险偏好回升
      - 长端利率改善 + 权益走强
      - 资产质量数据连续改善
      - 分红 / 回购显著提升
    bearish_triggers:
      - 成交萎缩 / 权益回落
      - 利率持续下行 + 投资亏损
      - 不良率上行 + 拨备消耗
      - 信用违约扩散

  tradability_panel:
    - {name: mu, formula: 路径影响 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    金融与高股息的图谱重点是判断成交、利率、资产质量与分红改善是否可持续，并
    避免在低估值假象下踩信用尾部。

