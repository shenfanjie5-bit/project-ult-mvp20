schema_version: 1
template_version: v3.1.1
industry_id: INNOVATIVE_PHARMA
industry_name_cn: 创新药生物医药与生物制造
graph_status: present

priors:
  boundary:
    scope_segments:
      - 创新药
      - Biotech
      - 抗体 / ADC / 细胞治疗 / 基因治疗
      - CXO
      - 医疗器械
      - 疫苗
      - 生物制造
      - 合成生物
      - 医药出海与 BD 授权
    core_judgment: >-
      该板块的核心不是医药整体贝塔，而是临床数据、审批进度、海外授权、商业化
      放量和现金流安全。亏损公司不能用 EPS 弹性，需要用管线价值、现金跑道和
      亏损收窄。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注临床、BD、商业化、CXO、生物制造、尾部风险等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 温和多头, probability: 0.10}
    - {name: 结构分化, probability: 0.30}
    - {name: 等待验证, probability: 0.25}
    - {name: 杀估值, probability: 0.25}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报、临床预期}
      - {name: price_implied_expectation, description: 股价隐含预期, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 学术会议、新闻}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 主要终点 / P 值}
      - {name: tail_risk_prob, description: 尾部风险, source: 临床失败、监管}

  path_dedup_groups: [事件组, 资金组, 需求组, 技术组, 风险组]

  exposure:
    factors:
      - 管线临床阶段（II/III）与适应症
      - 主要终点的可预测性
      - 海外 BD 授权概率与条款质量
      - 现金跑道与融资能力
      - 商业化放量的可重复性
      - 生物制造的 TAM 与单位成本
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 关键临床数据 / BD / 商业化大概率成功
      "4": 二线管线或商业化加速
      "3": 业务关联但贡献不确定
      "2": 主题映射弱
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 商业化与 BD 里程碑
      GrossMargin: 工艺成本与产能利用率
      OpexRatio: 研发投入大
      EBIT_EPS: 多数公司亏损 → 关注亏损收窄
      FCF: 现金跑道关键
      Leverage: 高研发期需融资

  valuation_mix:
    weights:
      SOTP_Pipeline: 0.40
      DCF: 0.25
      PS: 0.15
      PE: 0.10
      EV_EBITDA: 0.10
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 临床失败或安全性问题
      - 监管延迟 / FDA 反馈差
      - 现金不足导致融资稀释
      - 海外授权失败或条款收窄
      - CXO 客户研发预算缩减
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 临床数据公告与主要终点
    - BD / 授权金额与条款
    - 商业化销售数据与渠道覆盖
    - CXO 在手订单与新签
    - 现金余额与融资计划
    - 产业链 / 学术会议反馈

  falsification:
    bullish_triggers:
      - 关键临床数据阳性
      - 大额海外授权落地
      - 重磅商业化产品放量
      - CXO 订单连续上修
    bearish_triggers:
      - 临床失败 / 安全性问题
      - 监管反馈差
      - 现金不足或融资稀释
      - CXO 客户预算缩减

  tradability_panel:
    - {name: mu, formula: 路径影响聚合 - 风险, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差 + 临床方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到管线价值与混合估值
    - 扣除尾部风险
    - 输出 alpha 与可交易性

  one_line_summary: >-
    创新药生物医药的图谱重点是判断临床/BD/商业化路径是否真实兑现，并避免被亏
    损与稀释吞掉看似的利好。

