schema_version: 1
template_version: v3.1.1
industry_id: ROBOTICS
industry_name_cn: 机器人与具身智能高端装备
graph_status: present

priors:
  boundary:
    scope_segments:
      - 人形机器人
      - 工业机器人
      - 减速器
      - 丝杠
      - 伺服系统
      - 电机
      - 传感器
      - 控制器
      - 灵巧手
      - 机器视觉
      - 工控
      - 工业母机
      - 高端装备
    core_judgment: >-
      该板块的核心是从演示叙事切换到量产订单。股价弹性来自整机量产预期、核心
      零部件价值量、成本下降曲线和应用场景 ROI 验证。

  prediction_target:
    equation: r_i_h = market_beta_i × r_market_h + sector_beta_i × r_sector_h + alpha_i_h
    notes: 关注定点订单、AI 能力、成本下降、工业场景、估值反身性等路径。

  state_probabilities:
    - {name: 强多头, probability: 0.10}
    - {name: 等待验证, probability: 0.25}
    - {name: 结构分化, probability: 0.25}
    - {name: 温和多头, probability: 0.15}
    - {name: 杀估值, probability: 0.25}

  shock_model:
    formula: Shock_eff = Surprise_norm × Strength/5 × Novelty × Reliability × DataQuality × LagKernel × D_pre × D_post
    fields:
      - {name: consensus_expectation, description: 一致预期, source: 研报与产业调研}
      - {name: price_implied_expectation, description: 股价隐含预期, source: 涨跌、ETF}
      - {name: narrative_expectation, description: 叙事热度, source: 新闻、社媒}
      - {name: pre_event_runup, description: 事前涨幅, source: 5/20/60 日}
      - {name: post_event_reaction, description: 事后反应, source: 公告后}
      - {name: remaining_impact, description: 剩余影响, source: 理论 - 已反应}
      - {name: data_quality, description: 数据质量, source: 公告优先}
      - {name: tail_risk_prob, description: 尾部风险, source: 安全 / 交付}

  path_dedup_groups: [需求组, 成本组, 资金组, 叙事组, 风险组]

  exposure:
    factors:
      - 整机厂定点份额
      - 核心零部件价值量
      - 国产化与成本控制
      - AI 能力与软件壁垒
      - 工业场景客户绑定
      - 现金储备与扩产能力
    formula: Exposure = Sign × RevenueShare^a × Directness × PassThrough × CompetitivePosition × GeoProductOverlap × MonetizationAbility × BalanceSheetCapacity
    scoring:
      "5": 直接量产订单可验证
      "4": 直接受益但 ASP 待提升
      "3": 业务关联但贡献不确定
      "2": 主题映射弱商业化
      "1": 间接关系

  financial_vector:
    fields: [Revenue, GrossMargin, OpexRatio, EBIT, EPS, FCF, ROE, Leverage]
    notes:
      Revenue: 定点订单逐步释放
      GrossMargin: BOM 成本与良率
      OpexRatio: 研发投入前置
      EBIT_EPS: 量产爬坡阶段经营杠杆显著
      FCF: 扩产带来现金流压力
      Leverage: 部分零部件需要扩产融资

  valuation_mix:
    weights:
      PS: 0.30
      PE: 0.25
      EV_EBITDA: 0.15
      DCF: 0.10
      SOTP: 0.20
    note: v3.1.1 weight policy

  tail_risk:
    risk_factors:
      - 整机量产延期或被取消
      - 核心零部件良率不达标
      - 价格战导致 BOM 成本传导失败
      - 安全事故或召回事件
      - AI 能力商业化失败
    formula_note: alpha_i_h = R_max_i_h × tanh((mu_base - q_tail × LossSeverity - lambda_CVaR × CVaR) / tau_h)

  validation_signals:
    - 整机厂定点公告
    - 零部件量产订单与采购量
    - BOM 成本与国产化比例
    - AI 模型迭代与场景验证
    - 工业自动化订单与回款
    - 板块成交与 ETF 流入

  falsification:
    bullish_triggers:
      - 整机厂量产计划兑现
      - BOM 成本接近商业化阈值
      - AI 能力进入实际生产场景
      - 工业自动化订单连续上行
    bearish_triggers:
      - 量产延期或样机阶段反复
      - 价格战或交付不及预期
      - AI 能力 Demo 难以落地
      - 资金面拥挤导致估值兑现

  tradability_panel:
    - {name: mu, formula: 路径影响聚合 - 风险惩罚, interpretation: 预期超额收益}
    - {name: sigma, formula: 路径方差, interpretation: 不确定性}
    - {name: prob_up, formula: Phi(mu/sigma), interpretation: 上涨概率}
    - {name: tradability, formula: mu/sigma - 成本与拥挤, interpretation: 可交易性}
    - {name: residual_impact, formula: 理论影响 × D_pre × D_post, interpretation: 剩余未定价影响}

  workflow_steps:
    - 识别事件
    - 计算 Surprise
    - 扣除 D_pre / D_post
    - 通过主路径传导
    - 按相关性分组去重
    - 映射到财务向量与混合估值
    - 扣除尾部风险与拥挤
    - 输出 alpha 与可交易性

  one_line_summary: >-
    机器人与具身智能高端装备的图谱重点是判断从演示到量产的切换是否被订单和成
    本真实兑现，以及估值是否已经透支这一切换。

