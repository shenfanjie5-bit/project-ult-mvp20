[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ult-mvp20"
version = "0.1.0"
description = "20-stock Project ULT MVP orchestration shell."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
mvp20 = "mvp20.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mvp20*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
