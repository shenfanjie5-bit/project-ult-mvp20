name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate manifest and lock
        run: |
          mvp20 validate-manifest --manifest config/mvp20.universe.yaml
          mvp20 verify-lock --lock locks/modules.lock.yaml
          mvp20 plan-backfill --manifest config/mvp20.universe.yaml
          mvp20 run-fixture-e2e
      - name: Tests
        run: python -m pytest
