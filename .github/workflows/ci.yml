name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install vendored upstream modules (no-deps)
        # The [vendor] extras in pyproject is declarative-only; the real
        # install path is this per-vendor --no-deps loop. Without it the
        # adapter contract tests in test_server.py fall to 503
        # UPSTREAM_UNAVAILABLE and fail their 200-envelope assertions.
        run: |
          for v in contracts audit-eval data-platform entity-registry graph-engine main-core reasoner-runtime; do
            python -m pip install -e "./upstream/$v" --no-deps --ignore-requires-python
          done
      - name: Validate manifest and lock
        run: |
          mvp20 validate-manifest --manifest config/mvp20.universe.yaml
          mvp20 verify-lock --lock locks/modules.lock.yaml
          mvp20 plan-backfill --manifest config/mvp20.universe.yaml
          mvp20 run-fixture-e2e
      - name: Tests
        run: python -m pytest
